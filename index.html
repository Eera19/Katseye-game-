<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KATSEYE Dream Debut</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#170a2d;color:white;font-family:system-ui,sans-serif}button{font:inherit;border:0;cursor:pointer}
#app{min-height:100vh;background:radial-gradient(circle at 50% 0,#8253c9,#35115f 48%,#120820);padding:16px}.screen{max-width:950px;margin:auto;min-height:calc(100vh - 32px)}
.hud{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.pill{background:#ffffff1d;border:1px solid #ffffff33;border-radius:99px;padding:7px 11px;font-weight:800}
.title{text-align:center;font-size:clamp(38px,9vw,76px);letter-spacing:5px;margin:18px 0 0}.sub{text-align:center;opacity:.85}
.members{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:25px auto;max-width:900px}.member{text-align:center;font-weight:800}.avatar{height:200px;position:relative;display:flex;align-items:end;justify-content:center;animation:bob 1.2s infinite alternate}.body{width:68px;height:110px;border-radius:38px 38px 16px 16px}.head{position:absolute;top:38px;width:68px;height:70px;background:#ffd4bf;border-radius:50%;z-index:2;border:2px solid #63365e}.hair{position:absolute;top:17px;width:80px;height:78px;background:#24152c;border-radius:48% 52% 35% 35%;z-index:3}#24152c;border-radius:48% 52% 35% 35%;z-index:3}
.hair.bob{width:72px;height:70px;border-radius:48% 52% 38% 38%}
.hair.ponytail:after{content:"";position:absolute;right:-16px;top:10px;width:28px;height:55px;background:#24152c;border-radius:50%}
.hair.waves{height:82px;border-radius:55% 45% 45% 40%}
.hair.bangs:before{content:"";position:absolute;left:8px;right:8px;bottom:26px;height:30px;background:#24152c;border-radius:0 0 45% 45%}
.hair.curls{height:84px;border-radius:45% 55% 50% 45%;box-shadow:8px 8px 0 #24152c,-8px 10px 0 #24152c}
.hair.twintails:before,.hair.twintails:after{content:"";position:absolute;top:18px;width:25px;height:62px;background:#24152c;border-radius:50%}
.hair.twintails:before{left:-18px}
.hair.twintails:after{right:-18px}
.face{position:absolute;z-index:4;top:64px;width:54px;height:25px}.face:before,.face:after{content:"•";position:absolute;font-size:18px}.face:before{left:8px}.face:after{right:8px}
.menu,.choices{display:grid;gap:11px;max-width:600px;margin:25px auto}.big,.choice{border-radius:18px;padding:16px 18px;font-weight:850;text-align:left}.big{background:#ffffff1c;border:2px solid #ffffff44}.choice{background:white;color:#2a103d}.choice:active,.big:active{transform:scale(.98)}
.card{background:#140b27e8;border:1px solid #ffffff2c;border-radius:24px;padding:22px;max-width:820px;margin:28px auto}.card h2{margin-top:0}.result{text-align:center;background:#ffffff18;border-radius:16px;padding:16px;font-weight:900;font-size:19px;margin-bottom:12px}
.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{background:#ffffff18;padding:9px 12px;border-radius:99px;white-space:nowrap}.active{background:#ff79c9;color:#290936}.dressgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.item{background:#ffffff12;color:white;border:1px solid #ffffff25;border-radius:15px;padding:12px}.selected{outline:3px solid #ff8bd3}
.preview{height:175px;border-radius:20px;background:linear-gradient(135deg,#f5b8ff,#7567ff);display:grid;place-items:center}.player{width:78px;height:115px;background:linear-gradient(#ffacd8,#9bdcff);border-radius:40px 40px 18px 18px;position:relative}..player:before{content:"";position:absolute;width:70px;height:70px;background:#ffd3be;border-radius:50%;top:-52px;left:4px}
@media(max-width:700px){.members{grid-template-columns:repeat(3,1fr)}.avatar{height:155px;transform:scale(.8)}.dressgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div id="app"></div>
<script>
const M=[["Daniela","#c59cff","waves","#b87952"],["Lara","#ff9ed4","bob","#d99b78"],["Manon","#ffb0c8","long","#c9825b"],["Megan","#8ed7ff","ponytail","#a96845"],["Sophia","#ffe38d","waves","#e0ad8c"],["Yoonchae","#a8efb0","bangs","#f0c4a4"]];bob","#d99b78"],["Manon","#ffb0c8","long","#c9825b"],["Megan","#8ed7ff","ponytail","#a96845"],["Sophia","#ffe38d","waves","#e0ad8c"],["Yoonchae","#a8efb0","bangs","#f0c4a4"]];["Manon","#ffb0c8","long","#c9825b"],["Megan","#8ed7ff","ponytail","#a96845"],["Sophia","#ffe38d","waves","#e0ad8c"], ["Yoonchae","#a8efb0","bangs","#f0c4a4"]];
const S={chapter:1,points:3,energy:100,trust:{Daniela:0,Yoonchae:0},dress:{hair:"Soft Waves",top:"Pink Sweatshirt",bottom:"Baggy Jeans",shoes:"Chunky Sneakers",acc:[]}};
try{Object.assign(S,JSON.parse(localStorage.getItem("KATSEYE_GAME")||"{}"))}catch(e){}
function save(){localStorage.setItem("KATSEYE_GAME",JSON.stringify(S))}
function add(n){S.points+=n;save()}
function hud(){return `<div class="hud"><span class="pill">💎 ${S.points}</span><span class="pill">⚡ ${S.energy}</span><span class="pill">📖 Chapter ${S.chapter}</span></div>`}
function show(x){document.getElementById("app").innerHTML=`<div class="screen">${hud()}${x}</div>`}
function result(t,next){show(`<div class="card"><div class="result">${t}</div><button class="big" onclick="${next}">CONTINUE ›</button></div>`)}
function home(){show(`<h1 class="title">KATSEYE</h1><div class="sub">DREAM DEBUT ✦</div><div class="members">${M.map(m=>`<div class="member"><div class="avatar"><div class="hair ${m[2]}"></div><div class="head" style="background:${m[3]}"></div><div class="face"></div><div class="body" style="background:linear-gradient(135deg,${m[1]},#fff);border:none;box-shadow:none"></div></div>${m[0]}</div>`).join("")}</div><div class="menu"><button class="big" onclick="menu()">💗 TOUCH TO START</button></div>`) }
function menu(){show(`<h1 class="title">MENU</h1><div class="menu"><button class="big" onclick="start()">① PLAY</button><button class="big" onclick="you('hair')">② YOU — DRESS UP</button><button class="big" onclick="rules()">③ RULES</button></div>`)}
function rules(){show(`<div class="card"><h2>📜 RULES</h2><p>💗 Be kind to every member and crowd.</p><p>⏰ Practice starts at sharp 7.</p><p>🎤 Enjoy the game.</p><p>✨ Follow the rules.</p><button class="big" onclick="menu()">BACK</button></div>`)}
const DATA={hair:["Soft Waves","Long Straight","High Ponytail","Low Ponytail","Bob","Space Buns","Braids","Half-Up","Curly","Pink Waves","Blue Bob","Purple Long"],top:["Pink Sweatshirt","Lavender Hoodie","Star Sweater","Graphic Tee","Denim Jacket","Baby Tee","Cream Sweater","Black Hoodie"],bottom:["Baggy Jeans","Cargo Pants","Mini Skirt","Denim Shorts","Wide-Leg Pants","Pleated Skirt"],dress:["Pink Sweater Dress","Lavender Sweater Dress","Sparkle Dress","Cream Knit Dress"],shoes:["Chunky Sneakers","High-Top Sneakers","Black Boots","Pink Boots","Knee-High Boots","Platform Boots","Ballet Flats","Cute Heels"],acc:["Heart Bag","Star Clips","Sunglasses","Pearl Necklace","Bow","Headphones","Mini Backpack","Charm Bracelet","Hair Ribbon","Glitter Bag"]};
function you(tab){let d=DATA[tab];show(`<div class="card"><h2>👗 YOU — DRESS UP</h2><div class="preview"><div class="player"><div class="preview-hair">${S.dress.hair}</div><div class="preview-outfit">${S.dress.top}<br>${S.dress.bottom}<br>${S.dress.shoes}</div></div></div><div class="tabs">${Object.keys(DATA).map(k=>`<button class="tab ${k==tab?"active":""}" onclick="you('${k}')">${k.toUpperCase()}</button>`).join("")}</div><div class="dressgrid">${d.map(x=>`<button class="item" onclick="pick('${tab}',${JSON.stringify(x)})">${x}</button>`).join("")}</div><p>💎 Accessories equipped: ${S.dress.acc.length}/4</p><button class="big" onclick="menu()">SAVE & BACK</button></div>`)}
function pick(t,x){if(t==="acc"){if(S.dress.acc.includes(x))S.dress.acc=S.dress.acc.filter(a=>a!==x);else if(S.dress.acc.length<4)S.dress.acc.push(x)}else S.dress[t]=x;save();you(t)}
function start(){S.chapter=1;save();ch1()}
function ch1(){show(`<div class="card"><h2>CHAPTER 1 — DEBUT DAY 🌅</h2><p>YOU GOT SELECTED FOR DEBUT WITH KATSEYE!</p><p>Your first practice starts at 7:00 AM.</p><p><b>When do you wake up?</b></p><div class="choices"><button class="choice" onclick="wake(-2)">6:50 AM</button><button class="choice" onclick="wake(-2)">6:30 AM</button><button class="choice" onclick="wake(-1)">4:00 AM</button><button class="choice" onclick="wake(2)">5:00 AM</button></div></div>`)}
function wake(n){add(n);result(n>0?"🌟 Good choice! +2 points":n===-1?"😴 Too early… −1 point":"⏰ Cutting it close… −2 points","outfit()")}
function outfit(){show(`<div class="card"><h2>👚 PRACTICE OUTFIT</h2><p>No score hints — choose your style.</p><div class="choices"><button class="choice" onclick="out(-2)">Huge coat + beach sandals</button><button class="choice" onclick="out(-2)">Pajamas + slippers</button><button class="choice" onclick="out(-1)">Super sparkly stage look</button><button class="choice" onclick="out(2)">Cute comfy practice fit</button></div></div>`)}
function out(n){add(n);result(n>0?"💜 Perfect practice fit! +2":"😅 Interesting choice…","breakfast()")}
function breakfast(){show(`<div class="card"><h2>🥞 BREAKFAST</h2><div class="choices"><button class="choice" onclick="meal(2)">Full breakfast</button><button class="choice" onclick="meal(1)">Quick fruit</button><button class="choice" onclick="meal(-1)">Just coffee</button></div></div>`)}
function meal(n){S.energy=Math.max(0,Math.min(100,S.energy+n*8));save();result(n>0?"⚡ Energy restored!":"😵 Energy is low…","practice()")}
function practice(){show(`<div class="card"><h2>🕖 7:00 PRACTICE</h2><p>The music starts.</p><div class="choices"><button class="choice" onclick="pr(2)">Stay focused and match formation</button><button class="choice" onclick="pr(-1)">Rush the next move</button><button class="choice" onclick="pr(1)">Encourage the team while dancing</button></div></div>`)}
function pr(n){add(n);S.chapter=2;save();result(n>0?"💃 Strong team moment!":"😅 Recover on the next count.","ch2()")}
function ch2(){show(`<div class="card"><h2>CHAPTER 2 — THE TRUST TEST 💗</h2><p>Daniela and Yoonchae are still cautious about the new seventh member.</p><h3>Daniela's side quest</h3><p>She asks you to organize rehearsal notes.</p><div class="choices"><button class="choice" onclick="trust('Daniela',-2)">Ignore the notes</button><button class="choice" onclick="trust('Daniela',-1)">Help a little but rush</button><button class="choice" onclick="trust('Daniela',1)">Organize everything carefully</button></div></div>`)}
function trust(n,v){S.trust[n]+=v;save();result(v>0?"💗 Daniela Trust +1":"💬 Trust takes time.","ch2b()")}
function ch2b(){show(`<div class="card"><h2>Yoonchae's side quest 💚</h2><p>Help prepare the practice room.</p><div class="choices"><button class="choice" onclick="trust2(-2)">Leave it for her</button><button class="choice" onclick="trust2(-1)">Help for a few minutes</button><button class="choice" onclick="trust2(1)">Stay and finish together</button></div></div>`)}
function trust2(v){S.trust.Yoonchae+=v;S.chapter=3;save();result(v>0?"💚 Yoonchae Trust +1":"💬 Trust takes time.","ch3()")}
function ch3(){show(`<div class="card"><h2>CHAPTER 3 — THE FIRST PERFORMANCE 🎤</h2><p>A stage problem appears right before the show.</p><div class="choices"><button class="choice" onclick="stage(2)">Stay calm and help reset</button><button class="choice" onclick="stage(-2)">Panic and blame someone</button><button class="choice" onclick="stage(-1)">Freeze for a moment</button><button class="choice" onclick="stage(1)">Smile and keep formation moving</button></div></div>`)}
function stage(n){add(n);S.chapter=4;save();result(n>0?"🎤 You handled the stage problem!":"🎤 The show goes on…","ch4()")}
function ch4(){show(`<div class="card"><h2>CHAPTER 4 — THE EMPTY SPOTLIGHT</h2><p>The concert starts. Manon is on hiatus and fans notice the empty spot.</p><div class="choices"><button class="choice" onclick="concert(-2)">Forget about Manon and tear up while dancing</button><button class="choice" onclick="concert(-2)">Keep on looking at Manon's empty spot</button><button class="choice" onclick="concert(-1)">Try to stay focused and stare</button><button class="choice" onclick="concert(1)">Encourage the other team members and give a big smile</button></div></div>`)}
function concert(n){add(n);result(n>0?"💗 Your smile helped the team. +1":"💭 The moment was hard.","interview()")}
function interview(){show(`<div class="card"><h2>🎙️ FAN & NEWS INTERVIEWS</h2><div class="choices"><button class="choice" onclick="inter(-2)">Shout to the crowd and interviews</button><button class="choice" onclick="inter(-2)">Stay silent and let other answers</button><button class="choice" onclick="inter(-1)">Stutter, lose focus, and make up a lie</button><button class="choice" onclick="inter(1)">Say that KATSEYE need privacy and space; we will answer later</button></div></div>`)}
function inter(n){add(n);result(n>0?"💗 You protected the group's space. +1":"😶 The questions were overwhelming.","backstage()")}
function backstage(){show(`<div class="card"><h2>BACKSTAGE 💜</h2><p>Megan: “this space feels so empty with Manon.”</p><p>Lara: “why did she even have to go for hiatus”</p><p>Yoonchae stays silent.</p><p>Daniela asks what to do.</p><div class="choices"><button class="choice" onclick="back(1)">We should talk about Manon together.</button><button class="choice" onclick="back(0)">Give everyone some space tonight.</button><button class="choice" onclick="back(1)">Leave a little note for Manon.</button><button class="choice" onclick="back(1)">Cheer everyone up and practice.</button></div></div>`)}
function back(n){add(n);S.chapter=5;save();result("💗 The team gets through the night.","ch5()")}
function ch5(){show(`<div class="card"><h2>CHAPTER 5 — THE COMMENTS 📱</h2><p>Daniela sees supportive comments, hateful comments, and “WHERE IS MANON?” reels.</p><div class="choices"><button class="choice" onclick="social(-1)">Keep scrolling and read everything</button><button class="choice" onclick="social(1)">Put the phone away and talk to members</button><button class="choice" onclick="social(-1)">Reply to comments yourself</button><button class="choice" onclick="social(1)">Show everyone the posts and ask what they think</button></div></div>`)}
function social(n){add(n);result(n>0?"💗 You chose the team over the noise.":"📱 The comments got to you.","song()")}
function song(){show(`<div class="card"><h2>🎵 “HOOTIE FROOTIE”</h2><p>The new fictional song drops. Some people love it; others complain because Manon isn't in it.</p><div class="choices"><button class="choice" onclick="dance(1)">Join the dance challenge</button><button class="choice" onclick="dance(0)">Watch first</button><button class="choice" onclick="dance(-1)">Read hateful comments</button></div></div>`)}
function dance(n){add(n);result("💃 The dance challenge begins!","dressChallenge()")}
function dressChallenge(){show(`<div class="card"><h2>👗 QUICK DRESS-UP CHALLENGE</h2><p>Choose your own look, then perform.</p><button class="big" onclick="you('hair')">OPEN YOUR CLOSET</button><button class="big" onclick="performance()">SKIP TO PERFORMANCE ›</button></div>`)}
function performance(){show(`<div class="card"><h2>🎬 3… 2… 1… RECORD!</h2><p>The dance starts. Views climb.</p><div class="choices"><button class="choice" onclick="views(2)">Hit every move</button><button class="choice" onclick="views(1)">Smile and keep it simple</button><button class="choice" onclick="views(-1)">Miss a count but recover</button></div></div>`)}
function views(n){add(n);S.chapter=6;save();result("📈 The upload is climbing!","ch6()")}
function ch6(){show(`<div class="card"><h2>CHAPTER 6 — THE CALL 💌</h2><p>Manon: “Hey girls… I've been watching everything. I miss you all. 💗 I think I'm ready to talk.”</p><div class="choices"><button class="choice" onclick="call(1)">Tell her you missed her</button><button class="choice" onclick="call(0)">Stay quiet and let her speak first</button><button class="choice" onclick="call(1)">Say you're happy to hear from her</button><button class="choice" onclick="call(-1)">Immediately demand answers</button></div></div>`)}
function call(n){add(n);result("💗 The conversation feels gentle.","meet()")}
function meet(){show(`<div class="card"><h2>🤍 SHE'S BACK</h2><p>The girls meet Manon. Everyone hugs.</p><p>At the sleepover, Manon explains she needed time away from pressure and noise. The team listens and understands.</p><div class="choices"><button class="choice" onclick="mall()">Go to the mall together</button><button class="choice" onclick="mall()">Stay together a little longer</button></div></div>`)}
function mall(){show(`<div class="card"><h2>🛍️ MALL DAY</h2><p>Manon disguises herself with a cap, sunglasses, mask, and oversized hoodie.</p><p>Quick shopping challenge!</p><div class="choices"><button class="choice" onclick="shop(1)">Pink sweater dress + boots</button><button class="choice" onclick="shop(1)">Oversized sweatshirt + baggy jeans + sneakers</button><button class="choice" onclick="shop(0)">Graphic tee + skirt + sneakers</button></div></div>`)}
function shop(n){add(n);S.chapter=7;save();result("🛍️ Shopping challenge complete!","ch7()")}
function ch7(){show(`<div class="card"><h2>CHAPTER 7 — ONE LAST PERFORMANCE 🌟</h2><p>The girls have another urgent performance. Manon returns for one last performance with them.</p><p><b>“I couldn't miss one last performance with my girls.”</b></p><div class="choices"><button class="choice" onclick="finale(2)">Trust the team and hit every count</button><button class="choice" onclick="finale(1)">Smile, breathe, and dance your heart out</button><button class="choice" onclick="finale(-1)">Rush the hardest rhythm</button></div></div>`)}
function finale(n){add(n);show(`<div class="card"><h1>🌟 SEASON 1 FINALE 🌟</h1><h2>THE FINAL PERFORMANCE</h2><p>Daniela, Lara, Manon, Megan, Sophia, Yoonchae — and you — finish the final move together.</p><p>🎤 KATSEYE: DREAM DEBUT</p><p><b>FINAL POINTS: ${S.points}</b></p><button class="big" onclick="you('hair')">👗 VIEW YOUR LOOK</button><button class="big" onclick="menu()">🏠 MENU</button></div>`)}
home();
</script></body></html>
